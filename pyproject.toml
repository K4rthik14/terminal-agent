[project]
name = "terminal-agent"
version = "0.1.0"
description = "A production-quality modular terminal coding agent."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "rich>=13.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.31.0",
]

[project.scripts]
nanocode = "cli.main:main"
agent = "cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "llm", "tools", "memory", "config", "cli", "utils", "context"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.9.0",
    "ruff>=0.4.0",
]

# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

# --- Mypy ---
[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true

# --- Pytest ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
